<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4936">
  <meta name="description" content="Interactive browser presentation of the Home Affairs Assistant student demo.">
  <title>Browser Demo | Citizen Services</title>
  <style>
    :root { color-scheme: light; --forest:#0b4936; --green:#18734f; --gold:#d5aa55; --ink:#17231d; --muted:#65726a; --paper:#f6f5f0; --line:#e2e7e1; --soft:#eaf3ed; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,a { font:inherit; }
    button:focus-visible,a:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .topbar { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px max(24px,calc((100vw - 1240px)/2)); background:var(--forest); color:#fff; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; }
    .mark { width:42px; height:42px; display:grid; place-items:center; border:2px solid var(--gold); border-radius:12px; font-weight:850; }
    .brand small { display:block; color:#dce9e1; font-size:11px; letter-spacing:.08em; }
    .demo-pill { border:1px solid #9db9a9; border-radius:999px; padding:6px 11px; color:#e6f2e9; font-size:12px; font-weight:750; white-space:nowrap; }
    .layout { max-width:1240px; min-height:calc(100vh - 72px); margin:auto; display:grid; grid-template-columns:230px 1fr; }
    aside { padding:28px 16px; border-right:1px solid var(--line); }
    .back { display:block; margin:0 10px 28px; color:var(--green); font-size:13px; font-weight:700; text-decoration:none; }
    .nav-label { padding:0 12px 10px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .nav { width:100%; display:flex; align-items:center; gap:10px; margin:3px 0; padding:11px 12px; border:0; border-radius:9px; background:transparent; color:#415047; text-align:left; cursor:pointer; }
    .nav:hover,.nav.active { background:var(--soft); color:var(--forest); font-weight:750; }
    .nav-icon { width:20px; text-align:center; }
    .side-note { margin:34px 8px 0; padding:13px; border-radius:12px; background:#fffaf0; color:#655c46; font-size:12px; }
    main { min-width:0; padding:38px clamp(20px,5vw,58px) 60px; }
    .welcome { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:5px 0 7px; font-size:clamp(29px,4vw,40px); line-height:1.12; letter-spacing:-.035em; }
    h2 { margin:0 0 14px; font-size:20px; }
    h3 { margin:0 0 8px; font-size:16px; }
    p { margin:0 0 12px; color:var(--muted); }
    .date { color:var(--muted); font-size:13px; text-align:right; }
    .banner { margin-bottom:26px; padding:13px 16px; border:1px solid #d5e5d9; border-radius:12px; background:#f0f8f1; color:#355641; font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:27px; }
    .stat,.card,.panel { border:1px solid var(--line); border-radius:14px; background:var(--white); }
    .stat { padding:18px; }
    .stat span { display:block; color:var(--muted); font-size:13px; }
    .stat strong { display:block; margin-top:7px; color:var(--forest); font-size:25px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 13px; }
    .text-button { border:0; background:none; color:var(--green); font-weight:750; cursor:pointer; }
    .services { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .card { min-height:165px; padding:18px; }
    .service-icon { width:42px; height:42px; display:grid; place-items:center; margin-bottom:15px; border-radius:12px; background:var(--soft); font-size:20px; }
    .card p { min-height:43px; font-size:13px; }
    .small-link { padding:0; border:0; background:none; color:var(--green); font-size:13px; font-weight:800; cursor:pointer; }
    .panel { margin-top:25px; padding:20px; }
    .application { display:grid; grid-template-columns:1.2fr 1fr .8fr; gap:12px; align-items:center; padding:13px 0; border-top:1px solid var(--line); }
    .application:first-of-type { border-top:0; }
    .muted-small { color:var(--muted); font-size:12px; }
    .badge { display:inline-block; width:max-content; padding:5px 9px; border-radius:999px; background:#eaf3ed; color:var(--forest); font-size:11px; font-weight:800; }
    .primary,.secondary { display:inline-block; border-radius:9px; padding:11px 15px; font-weight:800; text-decoration:none; cursor:pointer; }
    .primary { border:1px solid var(--forest); background:var(--forest); color:#fff; }
    .secondary { border:1px solid #bfd0c5; background:#fff; color:var(--forest); }
    .primary:hover { background:#063a2b; }
    .button-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .step-list { margin:16px 0 0; padding:0; list-style:none; }
    .step-list li { position:relative; padding:0 0 19px 28px; color:var(--muted); }
    .step-list li:before { position:absolute; left:0; top:3px; width:14px; height:14px; border:3px solid #a9c5ae; border-radius:50%; background:#fff; content:""; }
    .step-list li.done:before { border-color:var(--green); background:var(--green); }
    .notice { margin-top:18px; padding:13px 15px; border-left:4px solid var(--gold); border-radius:0 8px 8px 0; background:#fffaf0; color:#655c46; font-size:13px; }
    .toast { position:fixed; right:22px; bottom:22px; max-width:360px; padding:14px 18px; border-radius:10px; background:#17231d; color:#fff; box-shadow:0 8px 24px #0003; }
    .hidden { display:none !important; }
    footer { padding:16px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; text-align:center; }
    @media(max-width:850px) { .layout { grid-template-columns:1fr; } aside { display:flex; gap:6px; overflow:auto; padding:10px 16px; border-right:0; border-bottom:1px solid var(--line); } .back,.nav-label,.side-note { display:none; } .nav { min-width:max-content; width:auto; margin:0; } main { padding-top:25px; } .services { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:560px) { .topbar { padding:12px 16px; } .layout { min-height:calc(100vh - 66px); } .demo-pill { font-size:10px; } .welcome { display:block; } .date { margin-top:8px; text-align:left; } .stats { grid-template-columns:1fr; } .stat { display:flex; justify-content:space-between; align-items:center; } .stat strong { margin:0; font-size:20px; } .services { grid-template-columns:1fr; } .application { grid-template-columns:1fr auto; } .application .stage { grid-column:1/-1; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark" aria-hidden="true">ZA</div><div>Citizen Services<small>HOME AFFAIRS ASSISTANT</small></div></div>
    <div class="demo-pill">PRESENTATION MODE · SAMPLE DATA</div>
  </header>
  <div class="layout">
    <aside aria-label="Demo navigation">
      <a class="back" href="/">← Back to project page</a>
      <div class="nav-label">Menu</div>
      <button class="nav active" data-view="overview"><span class="nav-icon">⌂</span>Overview</button>
      <button class="nav" data-view="applications"><span class="nav-icon">▤</span>Applications</button>
      <button class="nav" data-view="appointments"><span class="nav-icon">▦</span>Appointments</button>
      <button class="nav" data-view="notifications"><span class="nav-icon">♧</span>Notifications</button>
      <button class="nav" data-view="security"><span class="nav-icon">◇</span>Security notes</button>
      <div class="side-note">This browser demo is isolated from the live API. No information entered here is sent or saved.</div>
    </aside>
    <main id="content" tabindex="-1"></main>
  </div>
  <footer>Independent student prototype · Not an official government service · Use fictional information only</footer>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
    const content = document.getElementById('content');
    const navButtons = [...document.querySelectorAll('[data-view]')];
    const pages = {
      overview: () => `
        <div class="welcome"><div><div class="eyebrow">Citizen dashboard</div><h1>Good morning, Thandi</h1><p>Here is a sample overview of your Home Affairs services.</p></div><div class="date">DEMO ACCOUNT<br><strong>Profile: Sample Citizen</strong></div></div>
        <div class="banner"><strong>Presentation mode:</strong> all names, application references and activity shown here are fictional sample data.</div>
        <div class="stats"><div class="stat"><span>Active applications</span><strong>2</strong></div><div class="stat"><span>Upcoming appointments</span><strong>1</strong></div><div class="stat"><span>Unread notifications</span><strong>2</strong></div></div>
        <div class="section-head"><h2>Popular services</h2><button class="text-button" data-view="services">View all services →</button></div>
        <section class="services">
          <article class="card"><div class="service-icon">▣</div><h3>Passport</h3><p>Apply for or renew a South African passport.</p><button class="small-link" data-action="apply" data-service="Passport">Explore service →</button></article>
          <article class="card"><div class="service-icon">▤</div><h3>Smart ID card</h3><p>Start a sample Smart ID application.</p><button class="small-link" data-action="apply" data-service="Smart ID card">Explore service →</button></article>
          <article class="card"><div class="service-icon">▦</div><h3>Birth certificate</h3><p>See the steps for a certificate request.</p><button class="small-link" data-action="apply" data-service="Birth certificate">Explore service →</button></article>
        </section>
        <section class="panel"><div class="section-head"><h2>Recent application</h2><button class="text-button" data-view="applications">View applications →</button></div><div class="application"><div><strong>Passport renewal</strong><div class="muted-small">Sample reference: DEMO-2048</div></div><span class="badge">In review</span><div class="muted-small stage">Next: Collection notification</div></div></section>`,
      services: () => `
        <div class="welcome"><div><div class="eyebrow">Explore</div><h1>Services</h1><p>Browse the services represented in this student prototype.</p></div></div>
        <section class="services">
          ${[['Passport','▣','New applications and renewals.'],['Smart ID card','▤','Identity document services.'],['Birth certificate','▦','Birth registration and certificates.'],['Marriage certificate','♡','Marriage record services.'],['Citizenship','◈','Citizenship information and requests.'],['Appointments','◷','Plan a sample branch visit.']].map(([name,icon,desc])=>`<article class="card"><div class="service-icon">${icon}</div><h3>${name}</h3><p>${desc}</p><button class="small-link" data-action="apply" data-service="${name}">Explore service →</button></article>`).join('')}
        </section>`,
      applications: () => `
        <div class="welcome"><div><div class="eyebrow">My services</div><h1>Applications</h1><p>Sample progress for a fictional citizen.</p></div></div>
        <section class="panel"><h2>Passport renewal</h2><div class="muted-small">Reference DEMO-2048 · Submitted 8 October 2026</div><ul class="step-list"><li class="done">Application submitted</li><li class="done">Documents verified</li><li class="done">Application under review</li><li>Ready for collection</li></ul><span class="badge">IN REVIEW</span></section>
        <section class="panel"><h2>Smart ID card</h2><div class="application"><div><strong>New Smart ID</strong><div class="muted-small">Reference: DEMO-2051</div></div><span class="badge">Submitted</span><div class="muted-small stage">Documents being checked</div></div></section>`,
      appointments: () => `
        <div class="welcome"><div><div class="eyebrow">Plan a visit</div><h1>Appointments</h1><p>Preview an appointment flow using sample information.</p></div></div>
        <section class="panel"><h2>Upcoming visit</h2><div class="application"><div><strong>Johannesburg Civic Centre</strong><div class="muted-small">Passport collection · Sample booking</div></div><span class="badge">CONFIRMED</span><div class="muted-small stage">20 November 2026 · 09:30</div></div></section>
        <section class="panel"><h2>Preview a new appointment</h2><p>This example stays in your browser and is not submitted to Home Affairs or stored.</p><form id="appointment-form"><label for="branch">Sample branch</label><br><select id="branch" style="margin:8px 0 14px;padding:10px;border:1px solid #cbd7ce;border-radius:8px"><option>Johannesburg Civic Centre</option><option>Pretoria Central</option><option>Cape Town</option><option>Durban</option></select><br><label for="visit-date">Choose a demo date</label><br><input id="visit-date" type="date" value="2026-11-20" style="margin:8px 0;padding:10px;border:1px solid #cbd7ce;border-radius:8px"><div class="button-row"><button class="primary" type="submit">Preview booking</button></div></form></section>`,
      notifications: () => `
        <div class="welcome"><div><div class="eyebrow">Updates</div><h1>Notifications</h1><p>Example updates for the sample account.</p></div></div>
        <section class="panel"><div class="application"><div><strong>Documents verified</strong><div class="muted-small">Your sample passport application passed document review.</div></div><span class="badge">TODAY</span></div><div class="application"><div><strong>Appointment reminder</strong><div class="muted-small">A sample visit is scheduled for 20 November.</div></div><span class="badge">YESTERDAY</span></div><div class="application"><div><strong>Application received</strong><div class="muted-small">Your sample reference is DEMO-2048.</div></div><span class="badge">8 OCT</span></div></section>`,
      security: () => `
        <div class="welcome"><div><div class="eyebrow">Prototype boundaries</div><h1>Security notes</h1><p>This presentation mode uses local, fictional examples only.</p></div></div>
        <section class="panel"><h2>What this demo does</h2><p>It runs as a static page in your browser. It does not connect to the account, appointment, or application API routes and does not save the values you enter.</p><h2 style="margin-top:24px">Before handling real information</h2><ul><li>Use TLS everywhere and encrypt sensitive data at rest.</li><li>Keep personal information to the minimum needed and set retention/deletion rules.</li><li>Enforce authorization for every user and every record; keep staff access separate.</li><li>Rate-limit sign-in and registration, protect accounts with strong password hashing and extra verification for staff.</li><li>Keep database credentials and signing keys in server-side secrets; rotate them and restrict access.</li><li>Return generic errors to users, keep detailed logs private, and monitor and patch dependencies.</li><li>Have an incident response plan and assess hosting providers and data-processing agreements.</li></ul><div class="notice">Never use real ID numbers, passwords, biometrics, or payment details in a class presentation. The Android APK is a debug demo, not a production release.</div></section>`,
      apply: service => `
        <div class="welcome"><div><div class="eyebrow">Service information</div><h1>${escapeText(service)}</h1><p>A preview of the steps a citizen could follow.</p></div></div>
        <section class="panel"><h2>How the sample flow works</h2><ul class="step-list"><li class="done">Review the service requirements</li><li>Prepare supporting documents</li><li>Submit an application for review</li><li>Track updates and next steps</li></ul><div class="notice">This is a presentation preview. It does not submit a real application or collect identity documents.</div><div class="button-row"><button class="primary" data-action="sample-submit" data-service="${escapeText(service)}">Show sample submission</button><button class="secondary" data-view="services">Back to services</button></div></section>`
    };
    function escapeText(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function render(name, extra) {
      const key = pages[name] ? name : 'overview';
      content.innerHTML = pages[key](extra);
      navButtons.forEach(button => button.classList.toggle('active', button.dataset.view === key));
      content.focus({preventScroll:true});
    }
    let toastTimer;
    function toast(message) {
      const box = document.getElementById('toast');
      box.textContent = message;
      box.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add('hidden'), 3200);
    }
    document.addEventListener('click', event => {
      const view = event.target.closest('[data-view]');
      if (view) { render(view.dataset.view); return; }
      const action = event.target.closest('[data-action]');
      if (!action) return;
      if (action.dataset.action === 'apply') render('apply', action.dataset.service);
      if (action.dataset.action === 'sample-submit') toast(`Sample ${action.dataset.service} flow completed. Nothing was submitted or saved.`);
    });
    document.addEventListener('submit', event => {
      if (event.target.id !== 'appointment-form') return;
      event.preventDefault();
      toast('Sample appointment preview shown. Nothing was sent or stored.');
    });
    render('overview');
  </script>
</body>
</html>
